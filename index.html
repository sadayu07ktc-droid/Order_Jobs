<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>งานว่างใกล้คุณ — SSB</title>

<style>

<body class="min-h-screen w-full bg-gradient-to-br from-amber-50 via-stone-50 to-emerald-50">

<div class="p-4 sm:p-6 max-w-2xl mx-auto space-y-4 pb-10">

  <div class="bg-gradient-to-r from-emerald-700 to-emerald-600 rounded-2xl p-5 shadow-lg text-white">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
          งานว่างใกล้คุณ
        </h1>
        <p class="text-emerald-100 text-sm mt-1" id="driver-name">SSB Smart Supply</p>
      </div>
      <button onclick="loadJobs(true)" id="refresh-btn" class="flex items-center gap-2 bg-white/15 hover:bg-white/25 transition-colors rounded-xl px-3 py-2 text-sm font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="refresh-icon"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        รีเฟรช
      </button>

  </div>

  <div class="flex items-center justify-between flex-wrap gap-2 px-1">
    <p class="text-sm text-emerald-900 font-medium" id="job-count"></p>
    <button id="sort-btn" class="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full border bg-white border-amber-200 text-emerald-800 transition-colors">

  <div id="map" class="w-full h-72 rounded-2xl border border-amber-200"></div>

  <div id="claim-banner" class="hidden p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm scale-pop"></div>

</div>

<div id="modal" class="fixed inset-0 bg-black/40 z-50 hidden items-center justify-center p-4">
  <div id="modal-content" class="bg-white rounded-2xl p-5 max-w-sm w-full scale-pop space-y-4"></div>
</div>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden"></div>

<div id="loading" class="fixed inset-0 bg-amber-50/90 flex flex-col items-center justify-center gap-3 z-50">
  <svg class="spin" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5">
    <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
    <path d="M12 2a10 10 0 0 1 10 10"/>
  </svg>
  <p class="text-sm text-amber-700">กำลังโหลดงานว่าง...</p>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2DXaTVoX5cgUZjQrGlpx7tQ1-gwcYYB85eY8MElo2oaqBIxCsjVfL7yMiM8uuUw9YxA/exec';
const LIFF_ID = '2010274217-XNFGkzxL';

const ICONS = {
  truck: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  pin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  crate: '<path d="M2 7h20"/><path d="M3 7v12a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7"/><path d="M2 7l2.5-5h15L22 7"/><path d="M12 12v6"/><path d="M8 12v6"/><path d="M16 12v6"/>',
  leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
  navigation: '<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
  check: '<path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
};
function icon(name, size, extraClass) {
  size = size || 16; extraClass = extraClass || '';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + extraClass + '">' + (ICONS[name] || '') + '</svg>';
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = (str == null) ? '' : String(str);
  return div.innerHTML;
}
function formatDateDMY(dateStr) {
  const parts = String(dateStr).split('-');
  if (parts.length !== 3) return escapeHtml(dateStr);
  return parts[2] + '-' + parts[1] + '-' + parts[0];
}
function distKm(a, b) {
  const R = 6371;
  const dLat = (b[0]-a[0]) * Math.PI/180;
  const dLon = (b[1]-a[1]) * Math.PI/180;
  const x = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function safeId(str) {
  return String(str || '').replace(/[^a-zA-Z0-9_-]/g, '_');
}

function estimateDriveTime(distanceKm) {
  if (distanceKm == null || isNaN(distanceKm)) return '—';
  // ประมาณจากความเร็วเฉลี่ย 55 กม./ชม. เหมาะกับงานขนส่งต่างจังหวัด
  const minutes = Math.max(1, Math.round((distanceKm / 55) * 60));
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h > 0 && m > 0) return h + ' ชม. ' + m + ' นาที';
  if (h > 0) return h + ' ชม.';
  return m + ' นาที';
}

function openNavigate(orderId) {
  const job = JOBS.find(function(j) { return j.orderId === orderId; });
  if (!job || !job.pos) {
    showToast('ยังไม่มีพิกัดสำหรับงานนี้ครับ', 'warn');
    return;
  }

  let url = 'https://www.google.com/maps/dir/?api=1&destination=' +
    encodeURIComponent(job.pos[0] + ',' + job.pos[1]) +
    '&travelmode=driving';

  if (DRIVER_POS && DRIVER_POS_IS_REAL) {
    url += '&origin=' + encodeURIComponent(DRIVER_POS[0] + ',' + DRIVER_POS[1]);
  }

  window.open(url, '_blank');
}

let JOBS = [];
let MY_PLATES = [];
let MY_NAME = '';
let NOT_FARM = '';   // คนขับกลุ่ม Bulk/Packing → ชื่อกลุ่ม (หน้านี้ไม่โชว์งาน)
/* ── เลือกทะเบียนตอนรับงาน — แบบเดียวกับแอดมินมอบหมายงาน (Order_form) · 2026-10-08 ──
 *   รถพ่วง/CPO (ทะเบียน "แม่,ลูก"): แม่+ลูก (ค่าเริ่ม) · เฉพาะแม่ · แม่+ลูกคันอื่น · ยืมรถคันอื่น
 *   รถเดี่ยว: ทะเบียนตัวเอง · ยืมรถคันอื่น · ระบุเอง
 *   เดิมแยก "87-5215,87-5329" เป็น 2 ปุ่มให้เลือกป้ายเดียว → ออเดอร์ได้ทะเบียนเดียว ค่าแรงมองเป็นรถเดี่ยว
 *   ข้อมูล: getAvailableTrailerChildren (หางว่าง) + getAvailableVehicles (รถว่างแยกประเภท) — ตัวเดียวกับ Order_form */
let PLATE_MODE = null, PLAIN_PLATE = '';
let PLATE_EXTRA = null, PLATE_EXTRA_P = null;
function loadPlateExtras() {
  if (PLATE_EXTRA_P) return PLATE_EXTRA_P;
  const j = function (a) { return fetch(GAS_URL + '?action=' + a).then(function (r) { return r.json(); }).catch(function () { return {}; }); };
  PLATE_EXTRA_P = Promise.all([j('getAvailableTrailerChildren'), j('getAvailableVehicles')]).then(function (rs) {
    PLATE_EXTRA = { children: rs[0].children || [], groups: rs[1].groups || [] };
    if (!rs[0].success && !rs[1].success) PLATE_EXTRA_P = null;   // พังทั้งคู่ → เปิดใหม่ครั้งหน้าลองโหลดอีก
    return PLATE_EXTRA;
  });
  return PLATE_EXTRA_P;
}
const PC_ON = 'bg-emerald-600 border-emerald-600 text-white', PC_OFF = 'bg-amber-50 border-amber-200 text-emerald-800';
const PL_SEL = 'hidden w-full mt-2 px-3 py-2.5 rounded-xl border border-amber-200 bg-white text-sm text-emerald-900 focus:outline-none focus:ring-2 focus:ring-emerald-500';
function plateChipHtml(mode, label, on, val) {
  return '<button type="button" onclick="pickPlateMode(this)" data-mode="' + mode + '"' + (val ? ' data-val="' + escapeHtml(val) + '"' : '') +
    ' class="plate-chip px-3 py-1.5 rounded-full text-sm font-medium border transition-colors ' + (on ? PC_ON : PC_OFF) + '">' + escapeHtml(label) + '</button>';
}
function plateSectionHtml() {
  const P = MY_PLATES;
  let chips = '';
  if (P.length >= 2) {
    PLATE_MODE = 'pair';
    chips = plateChipHtml('pair', '🔗 แม่+ลูก (' + P[0] + ',' + P[1] + ')', true) +
            plateChipHtml('mother', '🚚 เฉพาะแม่ (' + P[0] + ')', false) +
            plateChipHtml('otherChild', '🔄 แม่+ลูกคันอื่น', false) +
            plateChipHtml('borrow', '🔄 ยืมรถคันอื่น', false);
  } else {
    PLATE_MODE = P.length ? 'plain' : 'borrow'; PLAIN_PLATE = P[0] || '';
    chips = P.map(function (p, i) { return plateChipHtml('plain', p + ' (รถตัวเอง)', i === 0, p); }).join('') +
            plateChipHtml('borrow', '🔄 ยืมรถคันอื่น', !P.length) +
            plateChipHtml('custom', 'ระบุเอง', false);
  }
  return '<div class="flex flex-wrap gap-2">' + chips + '</div>' +
    '<select id="pl-child" class="' + PL_SEL + '"><option value="">-- เลือกลูกคันอื่น --</option></select>' +
    '<select id="pl-borrow-type" class="' + PL_SEL + '" onchange="onPlBorrowType()"><option value="">-- เลือกประเภทรถที่ยืม --</option></select>' +
    '<select id="pl-borrow-veh" class="' + PL_SEL + '"><option value="">-- เลือกคันที่ยืม --</option></select>' +
    '<select id="pl-custom" class="' + PL_SEL + '"><option value="">-- เลือกทะเบียน --</option></select>' +
    '<p id="pl-borrow-note" class="hidden mt-2 text-xs text-amber-700">🔄 ยืมรถคันอื่น — GPS/ลงเวลาจะอ้างทะเบียนคันนี้</p>';
}
function _plEl(id) { return document.getElementById(id); }
function _plFill(sel, first, items) {   // items = [[value,label]]
  sel.innerHTML = '<option value="">' + first + '</option>' + items.map(function (it) {
    return '<option value="' + escapeHtml(it[0]) + '">' + escapeHtml(it[1]) + '</option>'; }).join('');
}
async function pickPlateMode(el) {
  document.querySelectorAll('.plate-chip').forEach(function (c) { c.className = c.className.replace(PC_ON, PC_OFF); });
  el.className = el.className.replace(PC_OFF, PC_ON);
  const mode = el.dataset.mode; PLATE_MODE = mode;
  if (mode === 'plain') PLAIN_PLATE = el.dataset.val || '';
  _plEl('pl-child').classList.toggle('hidden', mode !== 'otherChild');
  _plEl('pl-borrow-type').classList.toggle('hidden', mode !== 'borrow');
  _plEl('pl-borrow-note').classList.toggle('hidden', mode !== 'borrow');
  _plEl('pl-custom').classList.toggle('hidden', mode !== 'custom');
  if (mode !== 'borrow') _plEl('pl-borrow-veh').classList.add('hidden');
  if (['otherChild', 'borrow', 'custom'].indexOf(mode) < 0) return;
  const target = mode === 'otherChild' ? _plEl('pl-child') : mode === 'borrow' ? _plEl('pl-borrow-type') : _plEl('pl-custom');
  if (!PLATE_EXTRA) _plFill(target, 'กำลังโหลดรายการรถ…', []);
  const ex = await loadPlateExtras();
  if (PLATE_MODE !== mode) return;   // ผู้ใช้กดโหมดอื่นไปแล้วระหว่างรอ
  if (mode === 'otherChild') {
    const own = MY_PLATES[1] || '';
    _plFill(_plEl('pl-child'), '-- เลือกลูกคันอื่น --', ex.children.filter(function (c) { return c.child !== own; })
      .map(function (c) { return [c.child, c.child + ' (' + (c.ownerName || '—') + ')']; }));
  } else if (mode === 'borrow') {
    _plFill(_plEl('pl-borrow-type'), '-- เลือกประเภทรถที่ยืม --', ex.groups.map(function (g) { return [g.type, g.type + ' (ว่าง ' + g.vehicles.length + ' คัน)']; }));
  } else {
    const seen = {}, items = [];
    ex.groups.forEach(function (g) { g.vehicles.forEach(function (v) {
      String(v.plate || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (p) { if (!seen[p]) { seen[p] = 1; items.push([p, p]); } });
    }); });
    _plFill(_plEl('pl-custom'), '-- เลือกทะเบียน --', items);
  }
}
function onPlBorrowType() {
  const type = _plEl('pl-borrow-type').value, veh = _plEl('pl-borrow-veh');
  const g = (PLATE_EXTRA && PLATE_EXTRA.groups || []).find(function (x) { return x.type === type; });
  if (!type || !g) { veh.classList.add('hidden'); return; }
  _plFill(veh, '-- เลือกคันที่ยืม --', g.vehicles.map(function (v) { return [v.plate, v.plate + ' (' + (v.ownerName || '—') + ' - ' + v.status + ')']; }));   // อาจเป็น "หัว,ลูก"
  veh.classList.remove('hidden');
}
/* ทะเบียนที่จะส่ง — คืน { plate } หรือ { error } */
function resolvePlate() {
  const P = MY_PLATES;
  if (PLATE_MODE === 'pair') return { plate: P[0] + ',' + P[1] };
  if (PLATE_MODE === 'mother') return { plate: P[0] };
  if (PLATE_MODE === 'otherChild') { const c = _plEl('pl-child').value; return c ? { plate: P[0] + ',' + c } : { error: 'กรุณาเลือกลูกคันอื่นครับ' }; }
  if (PLATE_MODE === 'borrow') { const v = _plEl('pl-borrow-veh').value; return v ? { plate: v } : { error: 'กรุณาเลือกประเภท + คันที่ยืมครับ' }; }
  if (PLATE_MODE === 'custom') { const v = _plEl('pl-custom').value; return v ? { plate: v } : { error: 'กรุณาเลือกทะเบียนครับ' }; }
  if (PLATE_MODE === 'plain') return PLAIN_PLATE ? { plate: PLAIN_PLATE } : { error: 'กรุณาเลือกทะเบียนรถครับ' };
  return { error: 'กรุณาเลือก/ระบุทะเบียนรถครับ' };
}
let DRIVER_POS = null;
let DRIVER_POS_IS_REAL = false;
let SORT_BY_DISTANCE = false;
let CLAIMED_IDS = new Set();
let SELECTED_PLATE = null;
let FILTER_ORDER_ID = null;
let CLAIMING = false;
let ACTIVE_ORDER_ID = null;
let map, markers = {}, driverMarker;

const driverIcon = L.divIcon({
  html: '<div style="width:16px;height:16px;border-radius:50%;background:#4A7C3F;border:2px solid white;box-shadow:0 0 0 2px rgba(74,124,63,.25)"></div>',
  className: '', iconSize: [16,16], iconAnchor: [8,8]
});
const jobIcon = L.divIcon({
  html: '<div style="width:14px;height:14px;border-radius:50%;background:#D85A30;border:2px solid white"></div>',
  className: '', iconSize: [14,14], iconAnchor: [7,7]
});
const doneIcon = L.divIcon({
  html: '<div style="width:14px;height:14px;border-radius:50%;background:#888;border:2px solid white"></div>',
  className: '', iconSize: [14,14], iconAnchor: [7,7]
});

function initMap() {
  map = L.map('map', { zoomControl: false }).setView([13.140, 101.380], 9);
  // แผนที่ OpenStreetMap (ไม่ต้องใช้คีย์) — เดิมใช้ CARTO light_all แต่ CARTO เริ่มบังคับ API key ขึ้นลายน้ำ "API KEY REQUIRED" (2026-10-08)
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(map);
  L.control.zoom({ position: 'topright' }).addTo(map);

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        DRIVER_POS = [pos.coords.latitude, pos.coords.longitude];
        DRIVER_POS_IS_REAL = true;
        placeDriverMarker();
        recomputeDistances();
        rebuildJobMarkers();
        map.setView(DRIVER_POS, 11);
        render();
      },
      function(err) {
        console.warn('Geolocation denied/unavailable:', err.message);
        render();
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }
}

function placeDriverMarker() {
  if (!DRIVER_POS) return;
  if (driverMarker) {
    driverMarker.setLatLng(DRIVER_POS);
  } else {
    driverMarker = L.marker(DRIVER_POS, { icon: driverIcon }).addTo(map);
  }
  driverMarker.bindPopup(DRIVER_POS_IS_REAL ? '📍 ตำแหน่งของคุณ (GPS จริง)' : '📍 ตำแหน่งของคุณ');
}

function recomputeDistances() {
  JOBS.forEach(function(j) {
    j.distanceKm = (DRIVER_POS && j.pos) ? distKm(DRIVER_POS, j.pos) : null;
  });
}

function rebuildJobMarkers() {
  if (!map) return;
  Object.values(markers).forEach(function(m) { map.removeLayer(m); });
  markers = {};
  JOBS.forEach(function(j) {
    if (!j.pos) return;
    const m = L.marker(j.pos, { icon: CLAIMED_IDS.has(j.orderId) ? doneIcon : jobIcon }).addTo(map);
    m.bindPopup(jobPopupHtml(j), { minWidth: 220 });
    m.on('click', function() {
      highlightJobCard(j.orderId, false);
    });
    markers[j.orderId] = m;
  });
}

function jobPopupHtml(j) {
  const distLine = (j.distanceKm != null)
    ? '🧭 ' + j.distanceKm.toFixed(1) + ' กม. จากตำแหน่งคุณ<br>⏱️ ประมาณ ' + estimateDriveTime(j.distanceKm)
    : '🧭 ไม่ทราบระยะทาง';
  let h = '<div style="font-family:\'Sarabun\',sans-serif;min-width:180px">';
  h += '<div style="font-weight:600;color:#065F46;margin-bottom:2px">' + escapeHtml(j.gardenName) + '</div>';
  h += '<div style="font-size:11px;color:#92722A;margin-bottom:4px">' + escapeHtml(j.orderId) + '</div>';
  h += '<div style="font-size:12px;color:#374151;line-height:1.5">';
  h += '📅 ' + formatDateDMY(j.date) + ' · ' + escapeHtml(j.time) + '<br>';
  h += '📦 กระบะ ' + escapeHtml(j.binCount) + ' ใบ' + (j.rspo === 'มี' ? ' · 🌿 RSPO' : '') + '<br>';
  h += distLine;
  h += '</div>';
  h += '<div style="display:flex;gap:6px;margin-top:8px">';
  h += '<button onclick="highlightJobCard(\'' + escapeHtml(j.orderId) + '\', true)" style="flex:1;padding:6px 0;border-radius:8px;background:#059669;color:white;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:\'Sarabun\',sans-serif">ดูการ์ด</button>';
  h += '<button onclick="openNavigate(\'' + escapeHtml(j.orderId) + '\')" style="flex:1;padding:6px 0;border-radius:8px;background:#F59E0B;color:white;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:\'Sarabun\',sans-serif">นำทาง</button>';
  h += '</div>';
  h += '</div>';
  return h;
}

function highlightJobCard(orderId, scrollToCard) {
  ACTIVE_ORDER_ID = orderId;
  render();

  const el = document.getElementById('job-card-' + safeId(orderId));
  if (el && scrollToCard !== false) {
    setTimeout(function() {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  }

  const job = JOBS.find(function(j) { return j.orderId === orderId; });
  if (job && job.pos && map) {
    map.panTo(job.pos);
  }
}

function focusJob(orderId) {
  highlightJobCard(orderId, true);
}

function clearJobFilter() {
  FILTER_ORDER_ID = null;
  ACTIVE_ORDER_ID = null;
  render();
}

function jobCardHtml(job) {
  const claimed = CLAIMED_IDS.has(job.orderId);

  const rspoBadge = job.rspo === 'มี'
    ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300 shrink-0">' + icon("leaf", 11) + 'RSPO</span>'
    : '';
  const jobTypeBadge = (job.jobType && job.jobType !== 'ปาล์ม')
    ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-sky-100 text-sky-800 border border-sky-300">' + escapeHtml(job.jobType) + '</span>'
    : '';
  const distanceBadge = (job.distanceKm != null)
    ? '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 whitespace-nowrap">' + icon("navigation", 11) + job.distanceKm.toFixed(1) + ' กม.</span>'
    : '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-medium bg-stone-100 text-stone-400 border border-stone-200 whitespace-nowrap">' + icon("navigation", 11) + '— กม.</span>';

  const timeBadge = (job.distanceKm != null)
    ? '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200 whitespace-nowrap">⏱️ ' + estimateDriveTime(job.distanceKm) + '</span>'
    : '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-medium bg-stone-100 text-stone-400 border border-stone-200 whitespace-nowrap">⏱️ —</span>';

  const active = ACTIVE_ORDER_ID === job.orderId;
  let h = '<div id="job-card-' + safeId(job.orderId) + '" class="job-card bg-white rounded-2xl border border-amber-200 shadow-sm overflow-hidden ' + (claimed ? 'opacity-50' : '') + (active ? ' active-job' : '') + '">';
  h += '<div class="p-4 space-y-3">';
  h += '<div class="flex items-start justify-between gap-3">';
  h += '<div class="min-w-0">';
  h += '<div class="flex items-center gap-1.5 flex-wrap">';
  h += '<p class="font-semibold text-emerald-900 truncate">' + escapeHtml(job.gardenName || job.orderId) + '</p>';
  h += '<span class="active-label hidden items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-600 text-white">กำลังเลือก</span>';
  h += rspoBadge;
  h += '</div>';
  h += '<p class="text-xs text-amber-700/70 mt-0.5">' + escapeHtml(job.orderId) + '</p>';
  h += '</div>';
  h += '<div class="flex flex-col items-end gap-1.5 shrink-0">' + distanceBadge + timeBadge + jobTypeBadge + '</div>';
  h += '</div>';

  h += '<div class="flex flex-wrap gap-x-5 gap-y-1.5 text-sm text-emerald-800/90">';
  h += '<span class="flex items-center gap-1.5">' + icon("calendar", 14, "text-amber-500") + formatDateDMY(job.date) + ' · ' + escapeHtml(job.time) + '</span>';
  h += '<span class="flex items-center gap-1.5">' + icon("pin", 14, "text-amber-500") + escapeHtml(job.pickup || "—") + '</span>';
  h += '<span class="flex items-center gap-1.5">' + icon("crate", 14, "text-amber-500") + escapeHtml(job.binCount) + ' ใบ</span>';
  h += '</div>';

  if (job.rampInfo) {
    h += '<p class="text-xs bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-amber-800 flex items-start gap-1.5">' + icon("pin", 13, "mt-0.5 shrink-0") + escapeHtml(job.rampInfo) + '</p>';
  }
  if (job.note) {
    h += '<p class="text-xs bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-amber-800 flex items-start gap-1.5">' + icon("calendar", 13, "mt-0.5 shrink-0") + escapeHtml(job.note) + '</p>';
  }

  h += '<div class="grid grid-cols-2 gap-2 mt-1">';
  h += '<button onclick="openNavigate(\'' + escapeHtml(job.orderId) + '\')" class="py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-semibold text-sm transition-colors flex items-center justify-center gap-2">' + icon("navigation", 16) + 'นำทาง</button>';
  h += '<button onclick="openClaimModal(\'' + escapeHtml(job.orderId) + '\')" ' + (claimed ? 'disabled' : '') +
    ' class="py-2.5 rounded-xl ' + (claimed ? 'bg-stone-200 text-stone-500' : 'bg-emerald-600 hover:bg-emerald-700 text-white') + ' font-semibold text-sm transition-colors flex items-center justify-center gap-2">' +
    icon("check", 16) + (claimed ? 'รับแล้ว' : 'รับงานนี้') + '</button>';
  h += '</div>';

  h += '</div></div>';
  return h;
}

function render() {
  const gpsLabel = DRIVER_POS_IS_REAL
    ? '<span class="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-700">' + icon("navigation", 11) + 'ใช้ตำแหน่ง GPS จริง</span>'
    : '<span class="inline-flex items-center gap-1 text-[11px] font-medium text-stone-400">' + icon("navigation", 11) + 'ไม่ทราบตำแหน่ง</span>';

  if (FILTER_ORDER_ID) {
    const job = JOBS.find(function(j) { return j.orderId === FILTER_ORDER_ID; });
    document.getElementById('job-count').innerHTML =
      '<span class="flex items-center gap-2 flex-wrap">' +
        '<button onclick="clearJobFilter()" class="flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full border bg-white border-amber-200 text-emerald-800">' + icon("x", 12) + 'ดูทุกงาน</button>' +
        '<span>กำลังดู: ' + escapeHtml(job ? job.gardenName : FILTER_ORDER_ID) + '</span>' +
      '</span>';
    document.getElementById('job-list').innerHTML = job ? jobCardHtml(job) : '';
    return;
  }

  document.getElementById('job-count').innerHTML = 'มีงานว่าง ' + JOBS.length + ' งาน — กดเพื่อรับงาน &nbsp; ' + gpsLabel;

  let list = JOBS.slice();
  if (SORT_BY_DISTANCE) {
    list.sort(function(a, b) {
      if (a.distanceKm == null) return 1;
      if (b.distanceKm == null) return -1;
      return a.distanceKm - b.distanceKm;
    });
  }

  if (list.length === 0) {
    document.getElementById('job-list').innerHTML = NOT_FARM
      // 🆕 คนขับกลุ่ม Bulk/Packing — หน้านี้เป็นงานรถไร่ (backend คืน notFarm) · 2026-10-08
      ? '<div class="bg-white rounded-2xl border border-amber-200 p-8 text-center text-amber-700 space-y-1"><p class="font-semibold text-emerald-900">หน้านี้สำหรับคนขับรถไร่</p><p class="text-sm">คุณอยู่กลุ่ม ' + escapeHtml(NOT_FARM) + ' — แอดมินจะมอบหมายงานให้ทาง LINE ครับ</p></div>'
      : '<div class="bg-white rounded-2xl border border-amber-200 p-8 text-center text-amber-600">🎉 ตอนนี้ไม่มีงานว่างครับ</div>';
  } else {
    document.getElementById('job-list').innerHTML = list.map(jobCardHtml).join('');
  }
}

document.getElementById('sort-btn').addEventListener('click', function() {
  SORT_BY_DISTANCE = !SORT_BY_DISTANCE;
  const btn = document.getElementById('sort-btn');
  if (SORT_BY_DISTANCE) {
    btn.classList.remove('bg-white', 'border-amber-200', 'text-emerald-800');
    btn.classList.add('bg-emerald-600', 'border-emerald-600', 'text-white');
  } else {
    btn.classList.remove('bg-emerald-600', 'border-emerald-600', 'text-white');
    btn.classList.add('bg-white', 'border-amber-200', 'text-emerald-800');
  }
  render();
});

function openClaimModal(orderId) {
  const job = JOBS.find(function(j) { return j.orderId === orderId; });
  SELECTED_PLATE = null;

  const distLine = (job.distanceKm != null)
    ? '<p class="text-amber-700/80">' + icon("navigation", 12, "inline -mt-0.5 mr-1") + job.distanceKm.toFixed(1) + ' กม. จากตำแหน่งปัจจุบัน</p>'
    : '';

  let content = '<div class="flex items-center justify-between">';
  content += '<h2 class="text-lg font-bold text-emerald-900">ยืนยันรับงาน</h2>';
  content += '<button onclick="closeModal()" class="text-amber-400 hover:text-amber-600">' + icon("x", 20) + '</button>';
  content += '</div>';
  content += '<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-1 text-sm">';
  content += '<p class="font-semibold text-emerald-900">' + escapeHtml(job.gardenName || job.orderId) + '</p>';
  content += '<p class="text-amber-700/80">' + formatDateDMY(job.date) + ' · ' + escapeHtml(job.time) + ' · จุดรับ ' + escapeHtml(job.pickup || "—") + '</p>';
  content += distLine;
  content += '</div>';
  content += '<div>';
  content += '<label class="text-sm text-amber-700 block mb-2">เลือกทะเบียนรถ <span class="text-red-500">*</span></label>';
  content += plateSectionHtml();
  content += '</div>';
  content += '<button onclick="confirmClaim(\'' + escapeHtml(orderId) + '\')" id="confirm-btn" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold transition-colors flex items-center justify-center gap-2">' + icon("check", 18) + 'ยืนยันรับงาน</button>';

  document.getElementById('modal-content').innerHTML = content;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal').classList.add('flex');

  if (MY_PLATES.length === 0) {   // ไม่มีทะเบียนของตัวเอง → เริ่มที่ "ยืมรถคันอื่น" ให้เลือกคันที่ว่าง
    const b = document.querySelector('#modal-content .plate-chip[data-mode="borrow"]');
    if (b) pickPlateMode(b);
  }
}

function selectPlate(el, plate) {
  document.querySelectorAll('.plate-chip').forEach(function(c) {
    c.classList.remove('bg-emerald-600', 'border-emerald-600', 'text-white');
    c.classList.add('bg-amber-50', 'border-amber-200', 'text-emerald-800');
  });
  el.classList.remove('bg-amber-50', 'border-amber-200', 'text-emerald-800');
  el.classList.add('bg-emerald-600', 'border-emerald-600', 'text-white');
  SELECTED_PLATE = plate;
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal').classList.remove('flex');
  SELECTED_PLATE = null;
}

async function confirmClaim(orderId) {
  if (CLAIMING) return;
  const rp = resolvePlate();
  if (rp.error) { showToast(rp.error, 'warn'); return; }
  SELECTED_PLATE = rp.plate;

  CLAIMING = true;
  const btn = document.getElementById('confirm-btn');
  btn.disabled = true;
  btn.innerHTML = '<svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10"/></svg> กำลังบันทึก...';

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'claimJob',
        userId: window._userId,
        orderId: orderId,
        plate: SELECTED_PLATE
      })
    });

    const text = await res.text();
    let data = null;

    try {
      data = JSON.parse(text);
    } catch (jsonErr) {
      data = {
        success: text.indexOf('"success":true') > -1 || text.indexOf('success') > -1
      };
    }

    if (!data || !data.success) {
      showToast('❌ ' + ((data && data.error) || 'รับงานไม่สำเร็จ'), 'err');
      return;
    }

    const job = JOBS.find(function(j) { return j.orderId === orderId; });

    CLAIMED_IDS.add(orderId);
    ACTIVE_ORDER_ID = null;
    FILTER_ORDER_ID = null;

    closeModal();

    JOBS = JOBS.filter(function(j) {
      return j.orderId !== orderId;
    });

    if (markers[orderId]) {
      map.removeLayer(markers[orderId]);
      delete markers[orderId];
    }

    render();

    showToast('✅ รับงาน ' + orderId + ' แล้วครับ', 'ok');

    setTimeout(function() {
      loadJobs(false);
    }, 800);

  } catch (e) {
    console.error(e);
    showToast('❌ รับงานแล้ว แต่หน้าเว็บรีเฟรชไม่ทัน กรุณากดรีเฟรช', 'warn');
    closeModal();
    loadJobs(false);
  } finally {
    CLAIMING = false;
    const b = document.getElementById('confirm-btn');
    if (b) {
      b.disabled = false;
      b.innerHTML = icon("check", 18) + 'ยืนยันรับงาน';
    }
  }
}

function showToast(msg, type) {
  const colors = { ok: 'bg-emerald-600', err: 'bg-red-500', warn: 'bg-amber-500' };
  const el = document.getElementById('toast');
  el.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 z-50 ' + (colors[type] || colors.ok) + ' text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-lg max-w-[90vw] text-center scale-pop';
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { el.classList.add('hidden'); }, 3200);
}

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    window._userId = profile.userId;
    initMap();
    await loadJobs(false);
  } catch (e) {
    console.error(e);
    document.getElementById('loading').innerHTML = '<p class="text-sm text-red-600 px-6 text-center">โหลดไม่สำเร็จ: ' + escapeHtml(e.message || String(e)) + '</p>';
  }
}

async function loadJobs(isRefresh) {
  const btn = document.getElementById('refresh-btn');
  if (isRefresh && btn) btn.querySelector('.refresh-icon').classList.add('spin');

  try {
    const res = await fetch(GAS_URL + '?action=getAvailableJobs&userId=' + window._userId);
    const data = await res.json();

    if (!data.success) {
      document.querySelector('.max-w-2xl').insertAdjacentHTML('beforeend',
        '<div class="bg-white rounded-2xl border border-amber-200 p-8 text-center text-amber-700 mt-6">' + escapeHtml(data.error || 'เกิดข้อผิดพลาด') + '</div>');
      document.getElementById('loading').style.display = 'none';
      return;
    }

    JOBS = data.jobs || [];
    MY_PLATES = data.myPlates || [];
    MY_NAME = data.myName || '';
    NOT_FARM = data.notFarm ? (data.group || 'Bulk/Packing') : '';
    loadPlateExtras();   // เตรียมรายการหางว่าง/รถว่าง ไว้ให้ปุ่ม "ลูกคันอื่น / ยืมรถ / ระบุเอง" (เบื้องหลัง)
    document.getElementById('driver-name').textContent = MY_NAME ? ('สวัสดีครับ ' + MY_NAME) : 'SSB Smart Supply';

    recomputeDistances();
    rebuildJobMarkers();
    placeDriverMarker();
    render();
    document.getElementById('loading').style.display = 'none';
  } catch (e) {
    console.error(e);
    if (!isRefresh) {
      document.getElementById('loading').innerHTML = '<p class="text-sm text-red-600 px-6 text-center">เชื่อมต่อไม่ได้</p>';
    }
  } finally {
    if (isRefresh && btn) setTimeout(function() { const i = btn.querySelector('.refresh-icon'); if (i) i.classList.remove('spin'); }, 400);
  }
}

init();
</script>
</body>
</html>
